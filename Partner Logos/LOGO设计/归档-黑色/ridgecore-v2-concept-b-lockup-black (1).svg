<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="922" height="512"><rect width="360" height="200" fill="#000000"/><svg width="200" height="200" viewBox="0 0 200 200" x="0" y="0">
        <defs>
          <linearGradient id="bgB-lkxkla2p1s" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141416"/>
