        <!-- 3D 立方体/多面体 - 类似参考图2 -->
        <!-- 顶面 -->
        <polygon points="100,50 140,70 100,90 60,70" fill="url(#faceB3-lkxkla2p1s)" opacity="0.95"/>
        <!-- 左面 -->
        <polygon points="60,70 100,90 100,140 60,120" fill="url(#faceB2-lkxkla2p1s)" opacity="0.9"/>
        <!-- 右面 -->
        <polygon points="140,70 100,90 100,140 140,120" fill="url(#faceB1-lkxkla2p1s)" opacity="0.9"/>

        <!-- 切割面 - 底部切角 -->
        <polygon points="60,120 100,140 80,155" fill="url(#faceB2-lkxkla2p1s)" opacity="0.7"/>
        <polygon points="140,120 100,140 120,155" fill="url(#faceB4-lkxkla2p1s)" opacity="0.75"/>
        <polygon points="80,155 100,140 120,155 100,162" fill="#303438" opacity="0.8"/>

        <!-- 顶面三角切割线 (facets) -->
